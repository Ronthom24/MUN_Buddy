name: Keep backend alive

# Render's free tier spins the backend down after ~15 minutes of
# inactivity, causing a 30-50s cold start on the next request. This is a
# stopgap until the Render plan is upgraded to an always-on paid tier
# (the real fix) -- pinging the health endpoint often enough that it never
# goes idle long enough to spin down.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS https://mun-buddy.onrender.com/health
